<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KINOSOTA</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b1522;
    background-image: url('img/bg_soti.jpg');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    color: #e2e8f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.page {
    position: relative;
    width: 960px;
    margin: 0 auto;
    padding: 24px 20px 0 20px;
    box-sizing: border-box;
    text-align: left;
}

.back {
    position: absolute;
    top: 24px;
    right: 20px;
    display: inline-block;
    padding: 10px 22px;
    border: 2px solid #1e3a5f;
    background: #112236;
    color: #e2e8f0;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.back:hover,
.back:focus,
.back.focused {
    background: #1c385e;
    border-color: #00d2ff;
    color: #ffffff;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
    transform: scale(1.05);
    outline: none;
}

.brand {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #e2e8f0;
}

.tagline {
    margin-top: 4px;
    font-size: 20px;
    color: #94a3b8;
}

.intro {
    margin-top: 20px;
    text-align: center;
}

.intro-title {
    font-size: 28px;
    font-weight: bold;
    color: #e2e8f0;
}

.intro-text {
    margin-top: 4px;
    font-size: 20px;
    color: #94a3b8;
}

.cards {
    width: 100%;
    margin: 24px auto 0 auto;
    text-align: center;
}

.card {
    display: inline-block;
    vertical-align: top;
    width: 220px;
    margin: 0 35px;
    text-decoration: none;
    color: #e2e8f0;
    outline: none;
    border-radius: 12px;
    transition: transform 0.15s ease;
}

.card-image {
    display: block;
    width: 220px;
    height: 276px;
    border: 3px solid #1e3a5f;
    border-radius: 12px;
    background: #060d16;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.card:hover,
.card:focus,
.card.focused {
    transform: scale(1.08);
}

.card:hover .card-image,
.card:focus .card-image,
.card.focused .card-image {
    border-color: #00d2ff;
    box-shadow: 0 0 28px rgba(0, 210, 255, 0.7);
}

.card-title {
    margin-top: 14px;
    font-size: 24px;
    font-weight: bold;
    color: #e2e8f0;
}

.card-text {
    margin-top: 4px;
    font-size: 20px;
    color: #94a3b8;
}

.footer {
    margin-top: 28px;
    text-align: center;
    font-size: 19px;
    letter-spacing: 4px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="page">

    <a id="btn-back"
       class="back"
       tabindex="3"
       href="#"
       onclick="exitToRootApp(); return false;">
        ← НАЗАД В MSX
    </a>

    <div class="brand">KINOSOTA</div>
    <div class="tagline">Ваше кино. Ваша коллекция.</div>

    <div class="intro">
        <div class="intro-title">Добро пожаловать</div>
        <div class="intro-text">Выберите способ просмотра</div>
    </div>

    <div class="cards">

        <a id="card-app"
           class="card"
           tabindex="1"
           href="https://watch.scenrix.com/tv">

            <img class="card-image"
                 src="img/kinosota_app.jpg"
                 width="220"
                 height="276"
                 alt="KINOSOTA">

            <div class="card-title">ВОЙТИ В KINOSOTA</div>
            <div class="card-text">
                Фильмы и сериалы на большом экране
            </div>
        </a>

        <a id="card-android"
           class="card"
           tabindex="2"
           href="#"
           onclick="installAndroidTV(event); return false;">

            <img class="card-image"
                 src="img/kinosota_android_tv.jpg"
                 width="220"
                 height="276"
                 alt="KINOSOTA Android TV">

            <div class="card-title">УСТАНОВИТЬ НА ANDROID TV</div>
            <div class="card-text">
                KINOSOTA всегда с вами
            </div>
        </a>

    </div>

    <div class="footer">БОЛЬШЕ ЧЕМ ПРОСТО КИНО</div>

</div>

<script>
var KINOSOTA_APP_URL = "https://watch.scenrix.com/tv";

function openKinosota(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    window.location.href = KINOSOTA_APP_URL;
}

function installAndroidTV(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    return false;
}

function exitToRootApp() {
    try {
        if (window.TVXInteractionPlugin && window.TVXInteractionPlugin.executeAction) {
            window.TVXInteractionPlugin.executeAction('back');
            return;
        }
    } catch (e) {}
    try {
        window.history.go(1 - window.history.length);
    } catch (e) {
        window.history.back();
    }
}

// ── Smart TV Remote D-Pad Navigation ──
var focusable = ['card-app', 'card-android', 'btn-back'];
var currentIndex = 0;

function updateFocus(index) {
    if (index < 0) index = 0;
    if (index >= focusable.length) index = focusable.length - 1;
    currentIndex = index;
    var el = document.getElementById(focusable[currentIndex]);
    if (el) {
        el.focus();
    }
}

document.addEventListener('keydown', function(e) {
    var key = e.key || e.keyCode;
    // Arrow Left
    if (key === 'ArrowLeft' || key === 37) {
        if (currentIndex === 1) updateFocus(0);
        e.preventDefault();
    }
    // Arrow Right
    else if (key === 'ArrowRight' || key === 39) {
        if (currentIndex === 0) updateFocus(1);
        e.preventDefault();
    }
    // Arrow Up
    else if (key === 'ArrowUp' || key === 38) {
        updateFocus(2);
        e.preventDefault();
    }
    // Arrow Down
    else if (key === 'ArrowDown' || key === 40) {
        if (currentIndex === 2) updateFocus(0);
        e.preventDefault();
    }
    // Enter / OK
    else if (key === 'Enter' || key === 13) {
        var el = document.getElementById(focusable[currentIndex]);
        if (el) {
            el.click();
        }
        e.preventDefault();
    }
    // Back / Return (Samsung 10009, LG 461, Escape 27, Backspace 8)
    else if (key === 'Escape' || key === 'Backspace' || key === 27 || key === 8 || key === 10009 || key === 461) {
        exitToRootApp();
        e.preventDefault();
    }
});

window.addEventListener('load', function() {
    setTimeout(function() {
        updateFocus(0);
    }, 100);
});
</script>

</body>
</html>
